name: AWS OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-aws-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::012646747350:role/GastosApp-GitHubActions-Deploy
          aws-region: us-east-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity