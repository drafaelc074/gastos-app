name: AWS OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-aws-auth:
    runs-on: ubuntu-latest

       - name: Inspect OIDC token claims
        shell: bash
        run: |
          RESPONSE=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          echo "$TOKEN" | cut -d '.' -f2 | \
            base64 -d 2>/dev/null | \
            jq '{iss, aud, sub, repository, ref, environment}'
            
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::012646747350:role/GastosApp-GitHubActions-Deploy
          aws-region: us-east-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity