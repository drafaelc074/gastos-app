
name: AWS SSM Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-ssm:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::012646747350:role/GastosApp-GitHubActions-Deploy
          aws-region: us-east-2

      - name: Send test command to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0a974ea1a379826e2" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["echo GitHub Actions conectado a EC2 via SSM","hostname","whoami"]}' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0a974ea1a379826e2"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0a974ea1a379826e2" \
            --query '{Status:Status,Output:StandardOutputContent}' \
            --output json
