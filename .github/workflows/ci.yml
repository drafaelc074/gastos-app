name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gastos
          POSTGRES_USER: gastos_user
          POSTGRES_PASSWORD: gastos_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U gastos_user -d gastos"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes
        working-directory: backend
        env:
          DATABASE_URL: postgresql://gastos_user:gastos_password@localhost:5432/gastos
          SECRET_KEY: ci_test_secret_key_gastos_app_2026
        run: |
          python -m pytest -v

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Executar lint
        working-directory: frontend
        run: npm run lint

      - name: Validar build
        working-directory: frontend
        run: npm run build