name: Deploy Gastos App - EC2

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: gastos-app-staging
  cancel-in-progress: false


jobs:
  deploy:
    # Primeiro teste: permitir somente deploy manual
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::012646747350:role/GastosApp-GitHubActions-Deploy
          aws-region: us-east-2

      - name: Deploy via AWS SSM
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

        run: |
          set -euo pipefail

          INSTANCE_ID="i-0a974ea1a379826e2"
          # Validar o SHA recebido do GitHub
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ERROR: Invalid commit SHA"
            exit 1
          fi

          echo "Deploying commit: $DEPLOY_SHA"

          # Buscar e executar o script do commit aprovado
          REMOTE_COMMAND="runuser -u ubuntu -- bash -lc 'set -euo pipefail; cd /home/ubuntu/gastos-app; git fetch origin main; git show ${DEPLOY_SHA}:deploy/deploy.sh | bash -s -- ${DEPLOY_SHA}'"

          PARAMETERS=$(jq -n \
            --arg command "$REMOTE_COMMAND" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Gastos App deployment" \
            --timeout-seconds 900 \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)


          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)

            echo "SSM status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "ERROR: Deployment polling timed out."
          exit 1

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
