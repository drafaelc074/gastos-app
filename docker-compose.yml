services:

  postgres:
    image: postgres:16
    container_name: gastos-postgres

    environment:
      POSTGRES_DB: gastos
      POSTGRES_USER: gastos_user
      POSTGRES_PASSWORD: gastos_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastos_user -d gastos"]
      interval: 5s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend

    container_name: gastos-backend

    env_file:
      - ./backend/.env.docker

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend

    container_name: gastos-frontend

    environment:
      BACKEND_URL: http://backend:8000

    ports:
      - "3000:3000"

    depends_on:
      - backend

volumes:
  postgres_data: