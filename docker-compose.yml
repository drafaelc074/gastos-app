services:

  postgres:

    image: postgres:16

    container_name: gastos-postgres

    environment:
      POSTGRES_DB: gastos
      POSTGRES_USER: gastos_user
      POSTGRES_PASSWORD: gastos_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: